<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Out Of Office | Customizable Dashboard & Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F4F1EA',
                        'forest-deep': '#243B27',
                        'forest-mid': '#3D5E41',
                        'forest-light': '#5A805F',
                        'sage-accent': '#89A88F',
                        'sand-light': '#E8E3D5',
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                        handwriting: ['Satisfy', 'cursive'],
                    },
                    boxShadow: {
                        'cozy': '4px 6px 0px rgba(36, 59, 39, 0.15)',
                        'cozy-lg': '6px 10px 0px rgba(36, 59, 39, 0.18)',
                        'inset-soft': 'inset 2px 2px 6px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --text-color: #243B27;
            --card-bg: #FFFFFF;
            --accent-green: #3D5E41;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .border-pill {
            border-radius: 28px;
        }

        .custom-card {
            background-color: var(--card-bg);
            border: 2px solid rgba(36, 59, 39, 0.15);
            border-radius: 24px;
            transition: all 0.2s ease-in-out;
        }

        .custom-card:hover {
            box-shadow: 6px 8px 0px rgba(36, 59, 39, 0.12);
        }

        /* Inline Editable Focus outline */
        [contenteditable="true"]:hover {
            outline: 2px dashed #89A88F;
            outline-offset: 4px;
            border-radius: 4px;
        }
        [contenteditable="true"]:focus {
            outline: 2px solid #243B27;
            outline-offset: 4px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.8);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E8E3D5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #5A805F;
            border-radius: 10px;
        }

        .tab-btn.active {
            background-color: #243B27;
            color: #F4F1EA;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-sage-accent selection:text-forest-deep">

    <!-- TOP HEADER / EDIT BAR -->
    <header class="bg-sand-light/90 backdrop-blur-md border-b-2 border-forest-deep/20 sticky top-0 z-40 px-4 sm:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            
            <div class="flex items-center gap-3">
                <div class="bg-forest-deep text-cream p-2.5 rounded-2xl shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 00-2 2v2H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V10a2 2 0 00-2-2h-5V6a2 2 0 00-2-2h-2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 contenteditable="true" id="siteTitle" onblur="saveCustomization()" class="font-display font-extrabold text-xl sm:text-2xl text-forest-deep leading-tight uppercase tracking-wide">OUT OF OFFICE</h1>
                    <p contenteditable="true" id="siteSubtitle" onblur="saveCustomization()" class="text-xs text-forest-mid font-medium">This life isn't about waiting, it's about living</p>
                </div>
            </div>

            <!-- DYNAMIC PAGES & TAB NAVIGATION -->
            <nav id="pagesNav" class="flex flex-wrap items-center gap-1.5 bg-cream p-1.5 rounded-full border border-forest-deep/20">
                <!-- Tabs injected dynamically -->
            </nav>

            <!-- CONTROLS & CREATION -->
            <div class="flex items-center gap-2">
                <button onclick="openNewPageModal()" class="px-3 py-1.5 bg-forest-mid hover:bg-forest-deep text-cream text-xs font-bold rounded-full transition-all shadow-sm flex items-center gap-1">
                    <span>+ New Page</span>
                </button>
                <button onclick="toggleThemeModal()" class="p-2 bg-sand-light hover:bg-sage-accent text-forest-deep rounded-full transition-all shadow-sm" title="Customize Theme Colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                </button>
                <button onclick="resetToDefaultData()" class="px-3 py-1.5 bg-cream text-forest-deep border border-forest-deep/30 hover:bg-sand-light text-xs font-bold rounded-full transition-all" title="Reset default layout">Reset</button>
            </div>

        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
        
        <!-- DYNAMIC PAGE CONTENT CONTAINER -->
        <div id="activePageContent" class="space-y-8">
            <!-- Active page elements rendered dynamically -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center text-xs text-forest-mid border-t border-forest-deep/10 bg-sand-light/40 mt-12">
        <p contenteditable="true" id="footerText" onblur="saveCustomization()">MADE WITH LOVE BY THE SEA &bull; TIERRA DESIGN SYSTEM</p>
    </footer>

    <!-- COLOR & THEME CUSTOMIZATION MODAL -->
    <div id="themeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-forest-deep/60 backdrop-blur-md p-4 hidden">
        <div class="bg-cream border-4 border-forest-deep rounded-3xl p-6 max-w-md w-full shadow-cozy-lg space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-display font-extrabold text-xl text-forest-deep">Customize Site Colors</h3>
                <button onclick="toggleThemeModal()" class="text-forest-deep text-lg font-bold">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold mb-1">Background Color</label>
                    <input type="color" id="pickerBg" onchange="updateThemeColor('bg', this.value)" class="w-full h-10 rounded-xl cursor-pointer bg-white p-1 border">
                </div>
                <div>
                    <label class="block font-bold mb-1">Text Color</label>
                    <input type="color" id="pickerText" onchange="updateThemeColor('text', this.value)" class="w-full h-10 rounded-xl cursor-pointer bg-white p-1 border">
                </div>
                <div>
                    <label class="block font-bold mb-1">Card Background Color</label>
                    <input type="color" id="pickerCard" onchange="updateThemeColor('card', this.value)" class="w-full h-10 rounded-xl cursor-pointer bg-white p-1 border">
                </div>
            </div>
            <button onclick="toggleThemeModal()" class="w-full py-2.5 bg-forest-deep text-cream font-bold rounded-2xl">Done</button>
        </div>
    </div>

    <!-- NEW PAGE CREATION MODAL -->
    <div id="newPageModal" class="fixed inset-0 z-50 flex items-center justify-center bg-forest-deep/60 backdrop-blur-md p-4 hidden">
        <div class="bg-cream border-4 border-forest-deep rounded-3xl p-6 max-w-md w-full shadow-cozy-lg space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-display font-extrabold text-xl text-forest-deep">Create New Page</h3>
                <button onclick="closeNewPageModal()" class="text-forest-deep text-lg font-bold">&times;</button>
            </div>
            <form onsubmit="handleCreatePage(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold mb-1">Page Title</label>
                    <input type="text" id="newPageTitleInput" required placeholder="e.g., Summer Routes, Photo Gallery" class="w-full px-3 py-2 rounded-xl border border-forest-mid bg-white">
                </div>
                <div>
                    <label class="block font-bold mb-1">Page Type / Layout</label>
                    <select id="newPageTypeSelect" class="w-full px-3 py-2 rounded-xl border border-forest-mid bg-white font-medium">
                        <option value="hero_grid">Hero Banner & Feature Grid (Travel Style)</option>
                        <option value="route_cards">Modular Route Cards & About Us</option>
                        <option value="photo_album">Visual Photo Album Grid</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-forest-deep text-cream font-bold rounded-2xl">Create Page</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE & LOCAL STORAGE PERSISTENCE -->
    <script>
        const STORAGE_KEY = 'out_of_office_site_v3';

        // DEFAULT DATA STRUCTURE BASED EXACTLY ON IMAGE ATTACHMENTS
        const defaultSiteData = {
            customization: {
                siteTitle: 'OUT OF OFFICE',
                siteSubtitle: "This life isn't about waiting, it's about living",
                footerText: 'MADE WITH LOVE BY THE SEA • TIERRA DESIGN SYSTEM',
                bgColor: '#F4F1EA',
                textColor: '#243B27',
                cardColor: '#FFFFFF'
            },
            activePageId: 'home',
            pages: [
                {
                    id: 'home',
                    title: 'Home',
                    hero: {
                        title: 'Out Of Office',
                        subtitle: "This life isn't about waiting, it's about living",
                        image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200&q=80',
                        btn1Text: 'plan your route',
                        btn2Text: 'view route'
                    },
                    featureCards: [
                        {
                            id: 'fc1',
                            title: 'ready-made adventures',
                            subtitle: '5 proven routes',
                            image: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80'
                        },
                        {
                            id: 'fc2',
                            title: 'unique route',
                            subtitle: 'your complete freedom of choice',
                            image: ''
                        }
                    ],
                    aboutSection: {
                        title: 'ABOUT US',
                        body: `It all started with one disappointing trip. A standard tour promised to "discover Europe," but all it delivered were crowds, buses, and the feeling of being on an assembly line. We decided that wouldn't happen again.\n\nWe gathered some friends, mapped out our own itinerary—and fell in love with the process. We design personalized travel experiences with 24/7 support.`,
                        image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&q=80'
                    },
                    valuePills: [
                        { icon: '🕒', title: 'seamless travel logistics', desc: 'We handle trains, boutique stays, and local schedules. Just show up.' },
                        { icon: '🖼️', title: 'handpicked aesthetic spots', desc: 'No tourist traps. We guide you to hidden rooftop bars and views.' },
                        { icon: '🔒', title: 'purely private journeys', desc: 'Zero strangers in your group. Every route matches your rhythm.' },
                        { icon: '🤍', title: 'complete personal freedom', desc: 'No rigid daily schedules. You control your own pace and relaxation.' }
                    ],
                    routes: [
                        {
                            id: 'r1',
                            number: '1',
                            title: 'EURO-CORE UNLOCKED',
                            path: 'Route: Amsterdam — Brussels — Paris — Berlin — Prague',
                            description: "The ultimate debut. A whirlwind journey through Europe's creative capitals, blending canal-side calm, high-fashion streets, and intense techno nights.",
                            images: [
                                'https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?w=400&q=80',
                                'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&q=80',
                                'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=400&q=80',
                                'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=400&q=80'
                            ]
                        },
                        {
                            id: 'r2',
                            number: '2',
                            title: 'POSTCARD SUMMER',
                            path: 'Route: Barcelona — Marseille — Nice — Florence — Rome',
                            description: 'Endless golden hours, salty air, and artistic legacy. A journey from vibrant Catalan streets to the refined glamour of the French Riviera.',
                            images: [
                                'https://images.unsplash.com/photo-1539037116277-4db20889f2d4?w=400&q=80',
                                'https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=400&q=80'
                            ]
                        }
                    ]
                },
                {
                    id: 'about',
                    title: 'About us',
                    hero: {
                        title: 'OUR STORY & VISION',
                        subtitle: 'Crafting joyful, quiet, aesthetic journeys worldwide',
                        image: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1200&q=80',
                        btn1Text: 'read philosophy',
                        btn2Text: 'contact team'
                    },
                    featureCards: [],
                    aboutSection: {
                        title: 'THE OUT OF OFFICE PHILOSOPHY',
                        body: 'We believe travel should feel like an organic extension of your personal aesthetic. Less bureaucracy, more core memories.',
                        image: 'https://images.unsplash.com/photo-1476514525535-ce74f45814d0?w=600&q=80'
                    },
                    valuePills: [],
                    routes: []
                },
                {
                    id: 'gallery',
                    title: 'Gallery',
                    hero: {
                        title: 'AESTHETIC MEMORIES',
                        subtitle: 'Captured moments from our travelers',
                        image: 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=1200&q=80',
                        btn1Text: 'upload photo',
                        btn2Text: 'view album'
                    },
                    featureCards: [],
                    aboutSection: { title: '', body: '', image: '' },
                    valuePills: [],
                    routes: []
                }
            ]
        };

        let siteData = defaultSiteData;

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            applyThemeColors();
            renderNavigation();
            renderActivePage();
        });

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { siteData = JSON.parse(saved); } catch (e) { siteData = defaultSiteData; }
            } else {
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData));
        }

        function resetToDefaultData() {
            if (confirm("Reset to default layout, pages, and photos?")) {
                siteData = defaultSiteData;
                saveState();
                location.reload();
            }
        }

        /* CUSTOMIZATION & THEME */
        function applyThemeColors() {
            const c = siteData.customization;
            document.documentElement.style.setProperty('--bg-color', c.bgColor || '#F4F1EA');
            document.documentElement.style.setProperty('--text-color', c.textColor || '#243B27');
            document.documentElement.style.setProperty('--card-bg', c.cardColor || '#FFFFFF');

            document.getElementById('siteTitle').textContent = c.siteTitle;
            document.getElementById('siteSubtitle').textContent = c.siteSubtitle;
            document.getElementById('footerText').textContent = c.footerText;

            document.getElementById('pickerBg').value = c.bgColor || '#F4F1EA';
            document.getElementById('pickerText').value = c.textColor || '#243B27';
            document.getElementById('pickerCard').value = c.cardColor || '#FFFFFF';
        }

        function updateThemeColor(type, value) {
            if (type === 'bg') siteData.customization.bgColor = value;
            if (type === 'text') siteData.customization.textColor = value;
            if (type === 'card') siteData.customization.cardColor = value;
            saveState();
            applyThemeColors();
        }

        function saveCustomization() {
            siteData.customization.siteTitle = document.getElementById('siteTitle').textContent;
            siteData.customization.siteSubtitle = document.getElementById('siteSubtitle').textContent;
            siteData.customization.footerText = document.getElementById('footerText').textContent;
            saveState();
        }

        function toggleThemeModal() {
            document.getElementById('themeModal').classList.toggle('hidden');
        }

        /* NAVIGATION & PAGES MANAGEMENT */
        function renderNavigation() {
            const nav = document.getElementById('pagesNav');
            nav.innerHTML = siteData.pages.map(page => `
                <div class="flex items-center gap-1">
                    <button onclick="switchPage('${page.id}')" class="tab-btn ${page.id === siteData.activePageId ? 'active' : 'bg-transparent text-forest-deep hover:bg-sand-light'} px-3.5 py-1.5 rounded-full text-xs font-bold transition-all">
                        ${page.title}
                    </button>
                    ${siteData.pages.length > 1 ? `
                        <button onclick="deletePage('${page.id}')" class="text-xs text-forest-mid hover:text-red-600 px-1 font-bold" title="Delete Page">&times;</button>
                    ` : ''}
                </div>
            `).join('');
        }

        function switchPage(pageId) {
            siteData.activePageId = pageId;
            saveState();
            renderNavigation();
            renderActivePage();
        }

        function openNewPageModal() { document.getElementById('newPageModal').classList.remove('hidden'); }
        function closeNewPageModal() { document.getElementById('newPageModal').classList.add('hidden'); }

        function handleCreatePage(e) {
            e.preventDefault();
            const title = document.getElementById('newPageTitleInput').value.trim();
            if (!title) return;

            const newId = 'page_' + Date.now();
            siteData.pages.push({
                id: newId,
                title,
                hero: {
                    title: title.toUpperCase(),
                    subtitle: 'Custom page description',
                    image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80',
                    btn1Text: 'explore',
                    btn2Text: 'details'
                },
                featureCards: [],
                aboutSection: { title: 'ABOUT ' + title.toUpperCase(), body: 'Add your editable content here.', image: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600&q=80' },
                valuePills: [],
                routes: []
            });

            siteData.activePageId = newId;
            saveState();
            closeNewPageModal();
            renderNavigation();
            renderActivePage();
        }

        function deletePage(pageId) {
            if (siteData.pages.length <= 1) return;
            if (confirm("Delete this page?")) {
                siteData.pages = siteData.pages.filter(p => p.id !== pageId);
                siteData.activePageId = siteData.pages[0].id;
                saveState();
                renderNavigation();
                renderActivePage();
            }
        }

        /* RENDER ACTIVE PAGE CONTENT */
        function renderActivePage() {
            const page = siteData.pages.find(p => p.id === siteData.activePageId) || siteData.pages[0];
            const container = document.getElementById('activePageContent');

            container.innerHTML = `
                <!-- 1. HERO BANNER SECTION (Exact match to Image 1 top) -->
                <div class="relative h-[420px] sm:h-[480px] rounded-[32px] overflow-hidden shadow-cozy border-2 border-forest-deep/20 flex flex-col justify-between p-6 sm:p-10 group">
                    <img src="${page.hero.image}" id="heroImgDisplay" class="absolute inset-0 w-full h-full object-cover z-0" alt="Hero">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-black/40 z-10"></div>
                    
                    <!-- Quick Image Edit Badge -->
                    <button onclick="editImagePrompt('hero', '${page.id}')" class="absolute top-4 right-4 z-30 opacity-0 group-hover:opacity-100 bg-white/90 text-forest-deep text-xs font-bold px-3 py-1.5 rounded-full shadow-md transition-all">
                        📷 Edit Cover Photo
                    </button>

                    <div class="relative z-20 text-white flex justify-between items-start">
                        <div class="flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold">
                            <span>● Editable Page Banner</span>
                        </div>
                    </div>

                    <div class="relative z-20 text-white text-center space-y-3 my-auto max-w-3xl mx-auto">
                        <h1 contenteditable="true" onblur="updatePageHero('${page.id}', 'title', this.textContent)" class="font-display font-extrabold text-4xl sm:text-6xl uppercase tracking-wider drop-shadow-md">
                            ${page.hero.title}
                        </h1>
                        <p contenteditable="true" onblur="updatePageHero('${page.id}', 'subtitle', this.textContent)" class="text-sm sm:text-lg font-medium opacity-90 font-handwriting text-2xl">
                            ${page.hero.subtitle}
                        </p>
                    </div>

                    <div class="relative z-20 flex justify-center items-center gap-3">
                        <button contenteditable="true" onblur="updatePageHero('${page.id}', 'btn1Text', this.textContent)" class="px-6 py-2.5 bg-white text-forest-deep hover:bg-cream text-xs font-bold rounded-full shadow-md transition-all">
                            ${page.hero.btn1Text}
                        </button>
                        <button contenteditable="true" onblur="updatePageHero('${page.id}', 'btn2Text', this.textContent)" class="px-6 py-2.5 bg-white/20 backdrop-blur-md text-white hover:bg-white/30 text-xs font-bold rounded-full transition-all">
                            ${page.hero.btn2Text}
                        </button>
                    </div>
                </div>

                <!-- 2. FEATURE CARDS GRID (Exact match to Image 1 second block) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative h-64 rounded-[28px] overflow-hidden custom-card p-6 flex flex-col justify-end group">
                        <img src="${page.featureCards[0]?.image || 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80'}" class="absolute inset-0 w-full h-full object-cover z-0" alt="Feature 1">
                        <div class="absolute inset-0 bg-black/40 z-10"></div>
                        <button onclick="editImagePrompt('feature1', '${page.id}')" class="absolute top-4 right-4 z-30 opacity-0 group-hover:opacity-100 bg-white/90 text-forest-deep text-xs font-bold px-3 py-1 rounded-full shadow-md">📷 Change Photo</button>
                        <div class="relative z-20 text-white space-y-1">
                            <h3 contenteditable="true" onblur="updateFeatureCard('${page.id}', 0, 'title', this.textContent)" class="font-display font-extrabold text-2xl uppercase">${page.featureCards[0]?.title || 'ready-made adventures'}</h3>
                            <p contenteditable="true" onblur="updateFeatureCard('${page.id}', 0, 'subtitle', this.textContent)" class="text-sm font-semibold opacity-90">${page.featureCards[0]?.subtitle || '5 proven routes'}</p>
                        </div>
                    </div>

                    <div class="rounded-[28px] custom-card p-8 flex flex-col justify-between border-2 border-forest-deep/20 bg-white">
                        <div class="space-y-2">
                            <h3 contenteditable="true" onblur="updateFeatureCard('${page.id}', 1, 'title', this.textContent)" class="font-display font-extrabold text-4xl sm:text-5xl text-forest-deep uppercase tracking-tight leading-none">${page.featureCards[1]?.title || 'unique route'}</h3>
                        </div>
                        <p contenteditable="true" onblur="updateFeatureCard('${page.id}', 1, 'subtitle', this.textContent)" class="text-sm font-bold text-forest-mid">${page.featureCards[1]?.subtitle || 'your complete freedom of choice'}</p>
                    </div>
                </div>

                <!-- 3. ABOUT US & VALUE PILLS (Exact match to Image 1 middle) -->
                ${page.aboutSection ? `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- About Column -->
                    <div class="custom-card p-6 sm:p-8 space-y-4 lg:col-span-2 flex flex-col sm:flex-row gap-6 items-start">
                        <div class="w-full sm:w-48 h-48 rounded-2xl overflow-hidden relative flex-shrink-0 group">
                            <img src="${page.aboutSection.image}" class="w-full h-full object-cover" alt="About">
                            <button onclick="editImagePrompt('about', '${page.id}')" class="absolute inset-0 bg-black/50 text-white text-xs font-bold opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center">Change Photo</button>
                        </div>
                        <div class="space-y-3 flex-grow">
                            <h3 contenteditable="true" onblur="updateAbout('${page.id}', 'title', this.textContent)" class="font-display font-extrabold text-2xl text-forest-deep uppercase tracking-wide">${page.aboutSection.title}</h3>
                            <div contenteditable="true" onblur="updateAbout('${page.id}', 'body', this.innerText)" class="text-xs sm:text-sm text-forest-deep leading-relaxed space-y-2 whitespace-pre-line">
                                ${page.aboutSection.body}
                            </div>
                        </div>
                    </div>

                    <!-- Value Pills Column -->
                    <div class="custom-card p-6 space-y-4">
                        <div class="flex justify-between items-center border-b border-forest-deep/10 pb-3">
                            <h4 contenteditable="true" class="font-display font-extrabold text-sm text-forest-deep uppercase">WE TAKE RESPONSIBILITY FOR:</h4>
                            <button onclick="addValuePill('${page.id}')" class="text-xs text-forest-mid hover:text-forest-deep font-bold">+ Add</button>
                        </div>
                        <div class="space-y-3">
                            ${page.valuePills.map((pill, idx) => `
                                <div class="flex items-start gap-3 p-2 rounded-xl hover:bg-sand-light/50 transition-all">
                                    <span contenteditable="true" onblur="updatePill('${page.id}', ${idx}, 'icon', this.textContent)" class="text-lg">${pill.icon}</span>
                                    <div class="space-y-0.5 text-xs">
                                        <h5 contenteditable="true" onblur="updatePill('${page.id}', ${idx}, 'title', this.textContent)" class="font-bold text-forest-deep">${pill.title}</h5>
                                        <p contenteditable="true" onblur="updatePill('${page.id}', ${idx}, 'desc', this.textContent)" class="text-[11px] text-forest-mid">${pill.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ` : ''}

                <!-- 4. MODULAR ROUTES & ALBUM CARDS (Exact match to Image 1 bottom) -->
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="font-display font-extrabold text-2xl text-forest-deep uppercase">EXPLORE ROUTES & STAYS</h3>
                        <button onclick="addRouteCard('${page.id}')" class="px-4 py-1.5 bg-forest-mid hover:bg-forest-deep text-cream text-xs font-bold rounded-full">+ Add Route</button>
                    </div>

                    <div class="space-y-8">
                        ${page.routes.map((route, rIdx) => `
                            <div class="custom-card p-6 sm:p-8 space-y-4">
                                <div class="flex flex-wrap justify-between items-start gap-2 border-b border-forest-deep/10 pb-3">
                                    <h4 contenteditable="true" onblur="updateRoute('${page.id}', ${rIdx}, 'title', this.textContent)" class="font-display font-extrabold text-xl sm:text-2xl text-forest-deep uppercase">
                                        ${route.number}. ${route.title}
                                    </h4>
                                    <span contenteditable="true" onblur="updateRoute('${page.id}', ${rIdx}, 'path', this.textContent)" class="text-xs font-bold text-forest-mid bg-sand-light px-3 py-1 rounded-full">
                                        ${route.path}
                                    </span>
                                </div>

                                <p contenteditable="true" onblur="updateRoute('${page.id}', ${rIdx}, 'description', this.textContent)" class="text-xs sm:text-sm text-forest-deep leading-relaxed">
                                    ${route.description}
                                </p>

                                <!-- Route Photo Gallery Grid -->
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-2">
                                    ${route.images.map((imgUrl, imgIdx) => `
                                        <div class="h-32 sm:h-40 rounded-2xl overflow-hidden relative group bg-sand-light border border-forest-deep/10">
                                            <img src="${imgUrl}" class="w-full h-full object-cover" alt="Route photo">
                                            <button onclick="editRouteImage('${page.id}', ${rIdx}, ${imgIdx})" class="absolute inset-0 bg-black/50 text-white text-xs font-bold opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center">Change Photo</button>
                                        </div>
                                    `).join('')}
                                    <button onclick="addRouteImage('${page.id}', ${rIdx})" class="h-32 sm:h-40 rounded-2xl border-2 border-dashed border-forest-mid/40 flex flex-col items-center justify-center text-xs font-bold text-forest-mid hover:bg-sand-light/50 transition-all">
                                        <span>+ Add Photo</span>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        /* INLINE EDITING HELPERS */
        function updatePageHero(pageId, field, val) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page) { page.hero[field] = val; saveState(); }
        }

        function updateFeatureCard(pageId, cardIdx, field, val) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.featureCards[cardIdx]) { page.featureCards[cardIdx][field] = val; saveState(); }
        }

        function updateAbout(pageId, field, val) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.aboutSection) { page.aboutSection[field] = val; saveState(); }
        }

        function updatePill(pageId, idx, field, val) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.valuePills[idx]) { page.valuePills[idx][field] = val; saveState(); }
        }

        function addValuePill(pageId) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page) {
                page.valuePills.push({ icon: '✨', title: 'new custom feature', desc: 'Click to edit description text.' });
                saveState();
                renderActivePage();
            }
        }

        function updateRoute(pageId, rIdx, field, val) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.routes[rIdx]) { page.routes[rIdx][field] = val; saveState(); }
        }

        function addRouteCard(pageId) {
            const page = siteData.pages.find(p => p.id === pageId);
            if (page) {
                page.routes.push({
                    id: 'r_' + Date.now(),
                    number: (page.routes.length + 1).toString(),
                    title: 'NEW ADVENTURE ROUTE',
                    path: 'Route: Location A — Location B',
                    description: 'Click anywhere to edit this route description.',
                    images: ['https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400&q=80']
                });
                saveState();
                renderActivePage();
            }
        }

        /* IMAGE EDITING PROMPTS */
        function editImagePrompt(type, pageId) {
            const newUrl = prompt("Enter new Image URL (or Unsplash link):");
            if (!newUrl) return;
            const page = siteData.pages.find(p => p.id === pageId);
            if (!page) return;

            if (type === 'hero') page.hero.image = newUrl;
            if (type === 'feature1' && page.featureCards[0]) page.featureCards[0].image = newUrl;
            if (type === 'about' && page.aboutSection) page.aboutSection.image = newUrl;

            saveState();
            renderActivePage();
        }

        function editRouteImage(pageId, rIdx, imgIdx) {
            const newUrl = prompt("Enter new Image URL:");
            if (!newUrl) return;
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.routes[rIdx] && page.routes[rIdx].images[imgIdx]) {
                page.routes[rIdx].images[imgIdx] = newUrl;
                saveState();
                renderActivePage();
            }
        }

        function addRouteImage(pageId, rIdx) {
            const newUrl = prompt("Enter Image URL to add to gallery:", "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80");
            if (!newUrl) return;
            const page = siteData.pages.find(p => p.id === pageId);
            if (page && page.routes[rIdx]) {
                page.routes[rIdx].images.push(newUrl);
                saveState();
                renderActivePage();
            }
        }
    </script>
</body>
</html>
